<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hackathon Loma Negra — Los 8 casos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F14;
    --bg-panel: #16161F;
    --bg-panel-2: #1E1E2E;
    --line: rgba(255,255,255,0.07);
    --ink: #7C5CF6;
    --ink-soft: #9D85F8;
    --ink-dim: rgba(124,92,246,0.15);
    --ink-border: rgba(124,92,246,0.35);
    --orange: #F59E0B;
    --orange-soft: rgba(245,158,11,0.12);
    --text: #F4F4F8;
    --muted: #C4C4D0;
    --muted-2: #8A8A9A;
    --faint: #5A5A72;
    --good: #10D9A0;
    --good-soft: rgba(16,217,160,0.10);
    --bad: #F2545B;
    --bad-soft: rgba(242,84,91,0.10);
    --radius: 16px;
    font-size: 16px;
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-weight: 300;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    position: relative;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body::before {
    content: '';
    position: fixed;
    top: -20%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(ellipse, rgba(124,92,246,0.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 50%; height: 50%;
    background: radial-gradient(ellipse, rgba(124,92,246,0.10) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .mono { font-family: "Inter", sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  a { color: inherit; }

  /* ---------- Shell ---------- */
  #shell {
    display: flex;
    min-height: 100%;
    max-width: 1320px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  #rail {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 28px 20px 28px 28px;
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    min-width: 0;
    padding: 40px 48px 90px;
  }
  .brand {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 8px;
  }
  .rail-title {
    font-size: 1.32rem;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 22px;
    color: var(--text);
  }
  .rail-title em { color: var(--ink); font-style: normal; }

  .chain {
    position: relative;
    padding-left: 22px;
    border-left: 2px dashed var(--line);
  }
  .chain-item {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 11px 12px 11px 16px;
    margin-bottom: 5px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.86rem;
    line-height: 1.35;
  }
  .chain-item::before {
    content: "";
    position: absolute;
    left: -28px;
    top: 16px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--faint);
  }
  .chain-item:hover { background: var(--bg-panel-2); color: var(--text); }
  .chain-item.active { background: var(--ink-dim); border-color: var(--ink-border); color: var(--text); }
  .chain-item.active::before { background: var(--ink); border-color: var(--ink); }
  .chain-item .num {
    font-weight: 700;
    color: var(--ink-soft);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 2px;
  }
  .chain-item .name { font-weight: 600; color: var(--text); display: block; }
  .chain-item .rubro { display: block; color: var(--muted-2); font-size: 0.78rem; margin-top: 1px; font-weight: 300; }

  .rail-foot {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .rail-foot button {
    width: 100%;
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .rail-foot button:hover { border-color: var(--ink-border); color: var(--ink-soft); }

  /* ---------- Mobile nav toggle ---------- */
  #railToggle {
    display: none;
    position: fixed;
    z-index: 40;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    background: var(--ink-dim);
    border: 1px solid var(--ink-border);
    color: var(--ink-soft);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 14px;
    border-radius: 999px;
  }

  /* ---------- Home view ---------- */
  .eyebrow {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--ink-dim);
    border: 1px solid var(--ink-border);
    padding: 5px 14px;
    border-radius: 999px;
    margin: 0 0 22px;
  }
  h1.hero {
    font-size: clamp(2rem, 4.2vw, 3.1rem);
    line-height: 1.06;
    margin: 0 0 18px;
    font-weight: 900;
    letter-spacing: -0.02em;
    max-width: 18ch;
    color: var(--text);
  }
  h1.hero em { color: var(--ink); font-style: normal; }
  .lede {
    max-width: 62ch;
    color: var(--muted);
    font-weight: 300;
    font-size: 1.02rem;
    line-height: 1.7;
    margin: 0 0 34px;
  }
  .agenda {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
    margin-bottom: 44px;
  }
  .agenda .cell {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .agenda .cell .t {
    font-weight: 700;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-bottom: 6px;
  }
  .agenda .cell .d { font-size: 0.88rem; color: var(--muted); line-height: 1.4; font-weight: 300; }

  .map-label {
    font-size: 0.92rem;
    color: var(--muted-2);
    margin-bottom: 18px;
    max-width: 60ch;
    line-height: 1.5;
    font-weight: 300;
  }

  .station-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .station {
    position: relative;
    text-align: left;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    padding: 20px 18px 18px;
    font-family: inherit;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .station:hover { background: var(--bg-panel-2); }
  .station::before, .station::after {
    display: none;
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-color: var(--ink-soft);
    border-style: solid;
  }
  .station:hover { border-color: var(--ink-border); transform: translateY(-2px); }
  .station .code {
    font-weight: 700;
    color: var(--ink-soft);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .station .name { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; color: var(--text); }
  .station .rubro { color: var(--muted); font-size: 0.85rem; line-height: 1.4; font-weight: 300; }

  /* ---------- Group detail view ---------- */
  .crumb {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .g-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .g-head h1 {
    font-size: clamp(1.6rem, 3vw, 2.3rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .g-rubro {
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-weight: 500;
    margin: 0 0 28px;
  }

  section.block { margin-bottom: 38px; }
  section.block h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 14px;
    padding-bottom: 0;
    border-bottom: none;
  }
  p.resumen { font-size: 1.02rem; line-height: 1.65; max-width: 72ch; color: var(--text); font-weight: 300; }
  p.venta { font-size: 0.98rem; line-height: 1.6; max-width: 72ch; color: var(--muted); font-weight: 300; }

  .twocol {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) { .twocol { grid-template-columns: 1fr; } }
  .callout {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    border-left: 3px solid var(--good);
  }
  .callout.bad { border-left-color: var(--bad); }
  .callout .h { font-weight: 700; font-size: 0.72rem; margin-bottom: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .callout.good .h { color: var(--good); }
  .callout.bad .h { color: var(--bad); }
  .callout ul { margin: 0; padding-left: 18px; }
  .callout li { font-size: 0.92rem; line-height: 1.55; margin-bottom: 8px; color: var(--muted); font-weight: 300; }
  .callout li:last-child { margin-bottom: 0; }

  table.snap { width: 100%; border-collapse: collapse; max-width: 640px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table.snap td { padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
  table.snap td:first-child { color: var(--muted-2); width: 45%; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; }
  table.snap tr:last-child td { border-bottom: none; }

  .datafields { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .datafields .row { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid var(--line); }
  .datafields .row:last-child { border-bottom: none; }
  .datafields .k { padding: 12px 14px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); background: var(--bg-panel); border-right: 1px solid var(--line); }
  .datafields .v { padding: 12px 16px; font-size: 0.9rem; line-height: 1.55; color: var(--muted); background: var(--bg-panel-2); font-weight: 300; }
  @media (max-width: 640px) { .datafields .row { grid-template-columns: 1fr; } .datafields .k { border-right: none; border-bottom: 1px solid var(--line); } }

  .note {
    font-size: 0.85rem;
    color: var(--muted-2);
    font-style: italic;
    font-weight: 300;
    margin: 12px 0 0;
    max-width: 72ch;
    line-height: 1.5;
  }

  .dlbtn {
    display: inline-block;
    text-decoration: none;
    margin-top: 16px;
    background: var(--ink-dim);
    border: 1px solid var(--ink-border);
    color: var(--ink-soft);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .dlbtn:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .dlbtn:disabled { opacity: 0.7; cursor: default; }

  .phase-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .phase-grid { grid-template-columns: 1fr; } }
  .phase {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    border-top: 3px solid var(--tone, var(--ink));
    padding: 18px 18px 6px;
  }
  .phase.negocio { --tone: #10D9A0; }
  .phase.data { --tone: #7C5CF6; }
  .phase.mixto { --tone: #F59E0B; }
  .phase .ph-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tone); margin-bottom: 4px; }
  .phase .ph-sub { font-size: 0.74rem; color: var(--muted-2); margin-bottom: 14px; font-weight: 300; }
  .phase ol { margin: 0; padding-left: 18px; }
  .phase li { font-size: 0.86rem; line-height: 1.5; color: var(--muted); margin-bottom: 12px; font-weight: 300; }

  .pitchbox {
    border: 1px solid var(--orange);
    background: var(--orange-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    max-width: 72ch;
  }
  .pitchbox .h { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
  .pitchbox p { margin: 0; font-size: 0.94rem; line-height: 1.55; color: var(--text); font-weight: 300; }

  .navfoot {
    display: flex;
    justify-content: space-between;
    margin-top: 48px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    gap: 14px;
    flex-wrap: wrap;
  }
  .navfoot button {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.78rem;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 10px;
  }
  .navfoot button:hover { border-color: var(--ink-border); color: var(--ink-soft); }

  @media (max-width: 860px) {
    #railToggle { display: block; }
    #rail {
      position: fixed;
      z-index: 35;
      inset: 0 15% 0 0;
      transform: translateX(-102%);
      transition: transform .22s ease;
      box-shadow: 30px 0 60px rgba(0,0,0,.35);
    }
    #rail.open { transform: translateX(0); }
    #main { padding: 78px 22px 70px; }
    .g-head h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<button id="railToggle" onclick="document.getElementById('rail').classList.toggle('open')">MENÚ · 8 GRUPOS</button>

<div id="shell">
  <aside id="rail">
    <div class="brand">DIGITAL HOUSE · PROGRAMA IA APLICADA</div>
    <div class="rail-title">Hackathon<br><em>Loma Negra</em></div>
    <nav class="chain" id="chainNav"></nav>
    <div class="rail-foot">
      <button onclick="goHome()">← Volver al inicio</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const GROUPS = [
  {

  {
